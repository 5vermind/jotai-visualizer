name: Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum-react18
            node: 20.18.1
            react: 18.3.1
            react_dom: 18.3.1
            types_react: 18.3.31
            types_react_dom: 18.3.7
            jotai: 2.20.0
            vite: 6.4.3
            vite_react: 4.7.0
          - name: current-react19
            node: 22
            react: 19.2.8
            react_dom: 19.2.8
            types_react: 19.2.18
            types_react_dom: 19.2.4
            jotai: 2.20.2
            vite: 6.4.3
            vite_react: 4.7.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Apply compatibility versions
        run: node scripts/set-compat-versions.mjs
        env:
          COMPAT_REACT: ${{ matrix.react }}
          COMPAT_REACT_DOM: ${{ matrix.react_dom }}
          COMPAT_TYPES_REACT: ${{ matrix.types_react }}
          COMPAT_TYPES_REACT_DOM: ${{ matrix.types_react_dom }}
          COMPAT_JOTAI: ${{ matrix.jotai }}
          COMPAT_VITE: ${{ matrix.vite }}
          COMPAT_VITE_REACT: ${{ matrix.vite_react }}

      - name: Install matrix dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify compatibility
        run: pnpm check
